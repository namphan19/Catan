<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 168">
  <defs>
    <clipPath id="art">
      <rect x="13" y="13" width="94" height="119" rx="5"/>
    </clipPath>
    <linearGradient id="stonesky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#C6D0D8"/>
      <stop offset=".5" stop-color="#9AA2AC"/>
      <stop offset="1" stop-color="#6C737D"/>
    </linearGradient>
    <radialGradient id="stoneglow" cx="32%" cy="14%" r="80%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/>
      <stop offset=".55" stop-color="#DDE6EC" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3E444D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orebody" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#A8AEB6"/>
      <stop offset=".45" stop-color="#7E858E"/>
      <stop offset="1" stop-color="#4E545C"/>
    </linearGradient>
    <g id="oremini">
      <path d="M-6 3 L-4 -4 L3 -6 L7 0 L4 5 L-3 6 Z" fill="#878E97" stroke="#3B2F2F" stroke-width=".9"/>
      <path d="M-4 -4 L3 -6 L1 -1 Z" fill="#C6CCD2"/>
      <path d="M3 -6 L7 0 L1 -1 Z" fill="#6E747D"/>
      <circle cx="2" cy="2" r=".8" fill="#C9A227"/>
    </g>
  </defs>

  <!-- card frame -->
  <rect x="3" y="3" width="114" height="162" rx="10" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="3"/>
  <rect x="9" y="9" width="102" height="150" rx="6" fill="#FBF5E4" stroke="#B08C55" stroke-width="1.2"/>

  <!-- illustration -->
  <g clip-path="url(#art)">
    <rect x="13" y="13" width="94" height="119" fill="url(#stonesky)"/>
    <rect x="13" y="13" width="94" height="119" fill="url(#stoneglow)"/>
    <!-- distant range -->
    <path d="M13 66 L28 44 L42 58 L56 38 L72 58 L86 40 L99 54 L107 46 V80 H13 Z" fill="#A7ADB5" opacity=".8"/>
    <g fill="#E9F0F3" opacity=".9">
      <path d="M28 44 L33 51 L29 50 L26 54 L23 50 Z"/>
      <path d="M56 38 L62 47 L58 46 L54 50 L51 45 Z"/>
      <path d="M86 40 L91 47 L88 46 L85 50 L82 46 Z"/>
    </g>
    <!-- main ridge -->
    <path d="M13 86 L34 60 L54 84 L70 56 L92 84 L107 68 V112 H13 Z" fill="#8B939C"/>
    <path d="M34 60 L54 84 L46 112 H13 V94 Z" fill="#7A818B" opacity=".8"/>
    <path d="M70 56 L92 84 L84 112 H52 L54 84 Z" fill="#6E757F" opacity=".8"/>
    <g fill="#DDE6EA" opacity=".9">
      <path d="M34 60 L42 71 L37 70 L33 75 L29 69 Z"/>
      <path d="M70 56 L79 70 L73 68 L69 74 L64 68 Z"/>
      <path d="M92 84 L99 92 L95 91 L92 95 L88 91 Z"/>
    </g>
    <g fill="none" stroke="#565C65" stroke-width="1.1" opacity=".55" stroke-linecap="round">
      <path d="M32 78 L28 106 M52 88 L48 112 M78 78 L74 108 M96 94 L92 110"/>
    </g>
    <!-- foothill and mine adit -->
    <path d="M13 104 Q30 92 50 102 Q72 112 94 100 Q102 96 107 100 V132 H13 Z" fill="#737A84"/>
    <path d="M13 116 Q34 104 56 112 Q78 120 107 108 V132 H13 Z" fill="#646B75"/>
    <g transform="translate(30 104)">
      <path d="M-12 12 V-2 Q0 -14 12 -2 V12 Z" fill="#33363A" stroke="#2A2C2F" stroke-width="1.4"/>
      <path d="M-15 12 H15" stroke="#3F3A32" stroke-width="2"/>
      <path d="M-10 12 V0 M10 12 V0 M-13 -1 H13" stroke="#8A5A2B" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="0" cy="4" r=".9" fill="#C9A227"/>
    </g>
    <!-- central ore rock -->
    <g transform="translate(62 92)">
      <ellipse cx="0" cy="22" rx="27" ry="5" fill="#1B1512" opacity=".28"/>
      <path d="M-26 6 L-20 -8 L-8 -15 L10 -14 L23 -6 L27 5 L19 15 L5 19 L-12 17 L-23 12 Z" fill="url(#orebody)" stroke="#3B2F2F" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M-20 -8 L-8 -15 L-2 -4 L-12 2 Z" fill="#C6CCD2" opacity=".85"/>
      <path d="M-8 -15 L10 -14 L4 -2 L-2 -4 Z" fill="#A8AEB6"/>
      <path d="M10 -14 L23 -6 L13 3 L4 -2 Z" fill="#8D949C"/>
      <path d="M-26 6 L-12 2 L-6 12 L-12 17 L-23 12 Z" fill="#6A717A"/>
      <path d="M-6 12 L4 19 L5 8 L-2 4 Z" fill="#555C65"/>
      <path d="M4 19 L19 15 L27 5 L13 3 L5 8 Z" fill="#7A818A"/>
      <path d="M-12 2 L-2 4 L4 -2 L-2 -4 Z" fill="#B4BAC1" opacity=".8"/>
      <!-- metal flecks -->
      <g fill="#D9B84A" stroke="#6B4A12" stroke-width=".5">
        <circle cx="-14" cy="5" r="1.5"/>
        <circle cx="-4" cy="9" r="1.2"/>
        <circle cx="8" cy="6" r="1.4"/>
        <circle cx="16" cy="10" r="1.1"/>
        <path d="M-7 0 l2 1 M12 -4 l2 -1"/>
      </g>
      <g fill="#F0E0A0" opacity=".85">
        <circle cx="-13.4" cy="4.4" r=".5"/>
        <circle cx="8.4" cy="5.4" r=".5"/>
        <circle cx="15.4" cy="9.4" r=".4"/>
      </g>
    </g>
    <!-- loose ore rocks -->
    <use href="#oremini" transform="translate(28 120) scale(1.1)"/>
    <use href="#oremini" transform="translate(94 118) scale(.95) rotate(12)"/>
    <use href="#oremini" transform="translate(22 92) scale(.7)"/>
    <!-- alpine pines -->
    <g fill="#3D5F3B" stroke="#2B442C" stroke-width=".9">
      <path d="M18 84 L23 92 L20 92 L25 100 L11 100 L16 92 L13 92 Z"/>
      <path d="M101 88 L106 96 L103 96 L108 104 L94 104 L99 96 L96 96 Z"/>
    </g>
    <!-- vignette -->
    <path d="M13 13 H107 V132 H13 Z" fill="none" stroke="#2E3338" stroke-width="10" opacity=".12"/>
  </g>
  <rect x="13" y="13" width="94" height="119" rx="5" fill="none" stroke="#3B2F2F" stroke-width="1.6"/>

  <!-- corner medallions -->
  <g>
    <circle cx="18.5" cy="18.5" r="7.5" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="1.3"/>
    <circle cx="101.5" cy="18.5" r="7.5" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="1.3"/>
    <circle cx="18.5" cy="126.5" r="7.5" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="1.3"/>
    <circle cx="101.5" cy="126.5" r="7.5" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="1.3"/>
    <use href="#oremini" transform="translate(18.5 18.5) scale(.9)"/>
    <use href="#oremini" transform="translate(101.5 18.5) scale(.9) rotate(18)"/>
    <use href="#oremini" transform="translate(18.5 126.5) scale(.9) rotate(-15)"/>
    <use href="#oremini" transform="translate(101.5 126.5) scale(.9)"/>
  </g>

  <!-- nameplate -->
  <path d="M13 136 H107 V151 Q107 155 103 155 H17 Q13 155 13 151 Z" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="1.4"/>
  <path d="M17 139 H103" stroke="#C9A227" stroke-width="1" opacity=".9"/>
  <circle cx="60" cy="160" r="1.8" fill="#C9A227" stroke="#8B6A3C" stroke-width=".6"/>
</svg>
