  <path d="M12 45 Q16 30 32 30 Q48 30 52 45 Z" fill="#B5562B" stroke="#3B2F2F" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M20 38 q5 -4 12 -3 M36 34 q6 0 9 5" stroke="#D98E4A" stroke-width="1.8" fill="none" opacity=".85" stroke-linecap="round"/>
  <!-- brick stack -->
  <g stroke="#3B2F2F" stroke-linejoin="round">
    <rect x="14" y="40" width="16" height="9.5" fill="#D98E4A" stroke-width="2"/>
    <rect x="32" y="40" width="16" height="9.5" fill="#D98E4A" stroke-width="2"/>
    <rect x="23" y="30" width="16" height="9.5" fill="#E0A05E" stroke-width="2"/>
    <path d="M16 42 h8 M34 42 h8 M25 32 h8" stroke="#8A3A1B" stroke-width="1.2" opacity=".55" stroke-linecap="round"/>
    <path d="M16 41 h5 M34 41 h5 M25 31 h5" stroke="#F0B878" stroke-width="1.2" opacity=".8" stroke-linecap="round"/>
  </g>
  <!-- potter's trowel -->
  <g transform="translate(49 25) rotate(22)" stroke="#3B2F2F" stroke-linejoin="round">
    <rect x="-2.5" y="-11" width="5" height="13" rx="2" fill="#8A5A2B" stroke-width="1.8"/>
    <path d="M-6 2 h12 l-6 11 Z" fill="#8A8D91" stroke-width="1.8"/>
    <path d="M-4 4 h8" stroke="#F3E9D2" stroke-width="1" opacity=".4"/>
  </g>
  <!-- loose clay crumbs -->
  <path d="M12 51 q2 -3 5 0 q2 2 0 4 q-4 1 -5 -4 Z" fill="#C97A45" stroke="#3B2F2F" stroke-width="1.4"/>
  <path d="M46 53 q2 -2 4 0 q1 2 -1 3 q-3 0 -3 -3 Z" fill="#B5562B" stroke="#3B2F2F" stroke-width="1.3"/>
