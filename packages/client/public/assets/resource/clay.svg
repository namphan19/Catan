<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="2.5"/>
  <!-- sun-baked ground -->
  <path d="M9 47 Q20 38 32 41 Q44 44 55 38 V56 H9 Z" fill="#B5562B" opacity=".15"/>
