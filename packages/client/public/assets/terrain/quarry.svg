<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <defs>
    <clipPath id="hex">
      <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z"/>
    </clipPath>
    <linearGradient id="stone" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#B9BEC5"/>
      <stop offset=".5" stop-color="#8E949C"/>
      <stop offset="1" stop-color="#686E77"/>
    </linearGradient>
    <radialGradient id="sun" cx="30%" cy="14%" r="82%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#DCE4EA" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3E444D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#C7CCD2"/>
      <stop offset=".5" stop-color="#9BA1A9"/>
      <stop offset="1" stop-color="#6E747E"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#E9F0F3"/>
      <stop offset="1" stop-color="#C4D2DA"/>
    </linearGradient>
    <g id="pine-small">
      <path d="M0 -14 L5 -4 L2 -4 L7 4 L-7 4 L-2 -4 L-5 -4 Z" fill="#3D5F3B" stroke="#2B442C" stroke-width="1"/>
      <path d="M0 4 v4" stroke="#4A3A2A" stroke-width="1.4"/>
    </g>
  </defs>

  <g clip-path="url(#hex)">
    <rect width="200" height="230" fill="url(#stone)"/>
    <rect width="200" height="230" fill="url(#sun)"/>

    <!-- distant range -->
    <path d="M-8 110 L24 70 L46 96 L70 56 L96 96 L124 62 L150 100 L176 72 L208 110 V150 H-8 Z" fill="#A7ADB5" opacity=".75"/>
    <g fill="url(#snow)">
      <path d="M24 70 L34 84 L28 82 L23 88 L16 82 Z" opacity=".9"/>
      <path d="M70 56 L82 74 L74 71 L68 79 L61 70 Z" opacity=".9"/>
      <path d="M124 62 L136 80 L128 77 L122 85 L115 76 Z" opacity=".9"/>
      <path d="M176 72 L186 86 L180 83 L175 89 L169 83 Z" opacity=".85"/>
    </g>

    <!-- main peaks -->
    <g stroke="#565C65" stroke-linejoin="round">
      <path d="M18 146 L58 62 L96 144 Z" fill="url(#peak)" stroke-width="1.5"/>
      <path d="M74 152 L120 44 L168 152 Z" fill="url(#peak)" stroke-width="1.7"/>
      <path d="M126 150 L164 82 L202 150 Z" fill="url(#peak)" stroke-width="1.5"/>
    </g>
    <!-- snow caps -->
    <g fill="url(#snow)" stroke="#8F9BA4" stroke-width="1">
      <path d="M58 62 L72 92 L64 88 L58 96 L51 88 L44 92 Z"/>
      <path d="M120 44 L140 86 L130 82 L120 92 L111 80 L101 86 Z"/>
      <path d="M164 82 L178 110 L170 106 L164 114 L157 106 Z"/>
    </g>
    <!-- ridge shadows -->
    <g fill="#5E646D" opacity=".65">
      <path d="M58 62 L72 92 L66 150 L58 146 Z"/>
      <path d="M120 44 L140 86 L132 152 L120 148 Z"/>
      <path d="M164 82 L178 110 L174 150 L164 146 Z"/>
    </g>
    <g fill="none" stroke="#4C525C" stroke-width="1.2" opacity=".65" stroke-linecap="round">
      <path d="M54 78 L50 120 M64 96 L60 142 M116 60 L110 106 M128 90 L124 140 M160 96 L156 136"/>
      <path d="M34 132 L42 128 M78 128 L84 124 M144 128 L150 124"/>
    </g>

    <!-- rocky foreground -->
    <path d="M-6 152 Q28 132 58 150 Q84 166 112 150 Q144 132 174 150 Q190 158 204 154 V230 H-6 Z" fill="#7B818A"/>
    <path d="M-6 168 Q30 150 60 166 Q88 180 116 166 Q146 150 176 166 Q192 174 204 170 V230 H-6 Z" fill="#6E747D"/>
    <!-- scree and boulders -->
    <g fill="#9298A0" stroke="#565C65" stroke-width="1.1">
      <path d="M30 178 l5 -9 l11 0 l5 8 l-4 7 Z"/>
      <path d="M76 192 l4 -7 l9 0 l4 6 l-3 6 Z"/>
      <path d="M154 176 l5 -8 l10 0 l4 7 l-3 6 Z"/>
      <path d="M110 206 l3 -6 l8 0 l3 5 Z" opacity=".85"/>
    </g>
    <g fill="#B3B8BF" opacity=".7">
      <path d="M33 174 l4 -6 l5 0 l-2 6 Z"/>
      <path d="M157 172 l4 -5 l5 0 l-2 5 Z"/>
    </g>

    <!-- mine adit with timber frame and ore cart -->
    <g transform="translate(66 196)">
      <path d="M-18 12 V-8 Q0 -24 18 -8 V12 Z" fill="#3A3C40" stroke="#2E312F" stroke-width="1.6"/>
      <path d="M-22 12 H22" stroke="#4A3A2A" stroke-width="2"/>
      <path d="M-15 12 V-6 M15 12 V-6 M-19 -7 H19" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round"/>
      <path d="M-19 -7 H19" stroke="#B98B52" stroke-width="1" opacity=".6"/>
      <circle cx="0" cy="2" r="1" fill="#C9A227"/>
      <g fill="#7D838B" stroke="#4C525C" stroke-width="1">
        <path d="M-32 14 l4 -7 l9 0 l4 6 l-3 5 Z"/>
        <path d="M22 14 l4 -6 l8 0 l3 6 Z"/>
      </g>
    </g>
    <g transform="translate(126 200)">
      <path d="M-13 0 H11 L14 6 H-15 Z" fill="#6B4B2E" stroke="#3E2818" stroke-width="1.2"/>
      <circle cx="-7" cy="8" r="3.6" fill="#4A3A2A" stroke="#2B2320" stroke-width="1"/>
      <circle cx="7" cy="8" r="3.6" fill="#4A3A2A" stroke="#2B2320" stroke-width="1"/>
      <path d="M-9 -3 Q0 -8 8 -3 L9 0 H-10 Z" fill="#8E949C" stroke="#565C65" stroke-width="1"/>
    </g>

    <!-- alpine pines at the edge -->
    <use href="#pine-small" transform="translate(18 154) scale(1.1)"/>
    <use href="#pine-small" transform="translate(32 148) scale(.9)"/>
    <use href="#pine-small" transform="translate(184 148) scale(1.0)"/>
    <use href="#pine-small" transform="translate(196 156) scale(.8)"/>
    <g fill="#4C7A45" opacity=".7">
      <ellipse cx="22" cy="150" rx="14" ry="5"/>
      <ellipse cx="184" cy="146" rx="12" ry="4"/>
    </g>

    <path d="M100 12 L188 62 L188 168 L100 218 L12 168 L12 62 Z" fill="none" stroke="#EAF2F6" stroke-width="1.2" opacity=".25"/>
  </g>
  <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z" fill="none" stroke="#3E3A36" stroke-width="1.7" stroke-opacity=".65" stroke-linejoin="round"/>
</svg>
