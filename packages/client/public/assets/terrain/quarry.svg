<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <defs>
    <clipPath id="hex">
      <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hex)">
    <rect width="200" height="230" fill="#8C9095"/>
    <!-- rock texture / scree -->
    <g stroke="#3B2F2F" fill="none" opacity=".22" stroke-linecap="round">
      <path d="M26 92 q10 -5 20 0 M42 104 q8 -4 16 0 M140 104 q10 -5 20 0"/>
      <path d="M16 186 q12 -4 24 0 M150 196 q12 -4 24 0 M74 214 q12 -4 24 0"/>
    </g>

    <!-- left peak -->
    <g stroke="#3B2F2F" stroke-linejoin="round">
      <path d="M54 80 L20 172 L56 172 L88 92 Z" fill="#9CA2A8" stroke-width="2.4"/>
      <path d="M54 80 L88 92 L92 172 L56 172 Z" fill="#6E747A" stroke-width="2.4"/>
      <path d="M54 80 L42 112 L48 108 L54 116 L61 108 L66 112 Z" fill="#F3E9D2" stroke-width="2"/>
      <path d="M54 80 L66 112 L61 108 L54 116 L54 80 Z" fill="#D5DDE5" stroke-width="1.6"/>
      <path d="M54 80 L56 172" stroke-width="1.3" opacity=".45"/>
      <path d="M64 120 l8 26 M70 104 l12 32 M46 124 l-10 26" stroke-width="1.4" opacity=".28" fill="none"/>
    </g>

    <!-- right peak -->
    <g stroke="#3B2F2F" stroke-linejoin="round">
      <path d="M158 62 L124 172 L160 172 L192 92 Z" fill="#A2A8AE" stroke-width="2.4"/>
      <path d="M158 62 L192 92 L196 172 L160 172 Z" fill="#72787E" stroke-width="2.4"/>
      <path d="M158 62 L146 100 L152 96 L158 104 L166 96 L172 100 Z" fill="#F3E9D2" stroke-width="2"/>
      <path d="M158 62 L172 100 L166 96 L158 104 L158 62 Z" fill="#D5DDE5" stroke-width="1.6"/>
      <path d="M158 62 L160 172" stroke-width="1.3" opacity=".45"/>
      <path d="M146 110 l-12 34 M170 106 l12 34" stroke-width="1.4" opacity=".28" fill="none"/>
    </g>

    <!-- centre peak (tallest) -->
    <g stroke="#3B2F2F" stroke-linejoin="round">
      <path d="M104 30 L60 176 L104 176 L146 82 Z" fill="#ACB2B8" stroke-width="2.6"/>
      <path d="M104 30 L146 82 L152 176 L104 176 Z" fill="#787E84" stroke-width="2.6"/>
      <path d="M104 30 L82 94 L91 88 L98 98 L106 90 L114 99 L121 91 L128 96 Z" fill="#F3E9D2" stroke-width="2.2"/>
      <path d="M104 30 L128 96 L121 91 L114 99 L106 90 L104 90 Z" fill="#D5DDE5" stroke-width="1.8"/>
      <path d="M104 30 L104 176" stroke="#3B2F2F" stroke-width="1.4" opacity=".5"/>
      <path d="M92 100 l-12 34 M118 104 l14 34 M82 142 l-8 22 M128 148 l10 20" stroke="#3B2F2F" stroke-width="1.4" opacity=".3" fill="none"/>
      <!-- summit flag pole -->
      <path d="M104 30 v-8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- small pennant on the summit -->
    <path d="M104 22 l12 4 l-12 5 Z" fill="#C9A227" stroke="#3B2F2F" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- foreground rocky ledge -->
    <g stroke="#3B2F2F" stroke-linejoin="round">
      <path d="M8 176 Q44 162 78 176 L84 200 L36 214 L8 202 Z" fill="#676C72" stroke-width="2.2"/>
      <path d="M8 176 Q44 162 78 176" fill="none" stroke="#9CA2A8" stroke-width="2" opacity=".65"/>
      <path d="M116 180 Q148 166 186 178 L194 204 L146 216 L114 202 Z" fill="#6E7379" stroke-width="2.2"/>
      <path d="M116 180 Q148 166 186 178" fill="none" stroke="#A2A8AE" stroke-width="2" opacity=".6"/>
      <path d="M78 176 Q94 168 116 180 L118 200 L84 200 Z" fill="#7C8288" stroke-width="2.2"/>
    </g>

    <!-- mine adit with timber frame -->
    <g transform="translate(46 186)" stroke="#3B2F2F" stroke-linejoin="round">
      <path d="M-14 12 v-18 q14 -10 28 0 v18 Z" fill="#2B2320" stroke-width="2"/>
      <path d="M-16 10 v-18 q16 -12 32 0 v18" fill="none" stroke="#8A5A2B" stroke-width="3.4"/>
      <rect x="-17" y="6" width="34" height="5" rx="1.5" fill="#A6743E" stroke-width="1.8"/>
      <path d="M-10 12 v-6 M10 12 v-6" stroke="#A6743E" stroke-width="2.2"/>
      <path d="M-8 18 l4 -3 M0 20 l4 -3 M8 18 l4 -3" stroke="#3B2F2F" stroke-width="1.4" opacity=".5" fill="none"/>
    </g>

    <!-- pickaxe leaning on a rock -->
    <g transform="translate(146 196) rotate(-32)" stroke="#3B2F2F" stroke-linejoin="round">
      <path d="M-20 0 H22" stroke="#6B4E2E" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M18 -7 q6 7 0 14 q-4 -7 0 -14 Z" fill="#5C5F63" stroke-width="1.8"/>
      <path d="M-22 0 q-4 0 -4 -5 q6 1 8 3" fill="#5C5F63" stroke-width="1.8"/>
    </g>

    <!-- scattered boulders -->
    <g fill="#93989E" stroke="#3B2F2F" stroke-width="1.6" stroke-linejoin="round">
      <path d="M24 120 l4 -8 l11 -1 l5 8 l-4 7 l-12 1 Z"/>
      <path d="M166 148 l3 -6 l8 0 l4 6 l-3 5 l-9 0 Z"/>
      <path d="M118 208 l4 -7 l10 0 l4 7 l-4 6 l-10 0 Z"/>
      <path d="M60 146 l3 -5 l7 0 l3 5 l-3 4 l-7 0 Z" opacity=".9"/>
    </g>
    <path d="M100 13 L187 62 L187 168 L100 217 L13 168 L13 62 Z" fill="none" stroke="#F3E9D2" stroke-width="1.6" opacity=".13"/>
  </g>
  <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z" fill="none" stroke="#3B2F2F" stroke-width="4" stroke-linejoin="round"/>
</svg>
