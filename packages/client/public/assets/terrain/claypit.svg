<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <defs>
    <clipPath id="hex">
      <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z"/>
    </clipPath>
    <linearGradient id="earth" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#D8905D"/>
      <stop offset=".46" stop-color="#BE6438"/>
      <stop offset="1" stop-color="#9E4426"/>
    </linearGradient>
    <radialGradient id="sun" cx="30%" cy="16%" r="78%">
      <stop offset="0" stop-color="#FFE0AD" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#F3B26A" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7C2F1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#E6AE78"/>
      <stop offset=".55" stop-color="#CE8656"/>
      <stop offset="1" stop-color="#B2693E"/>
    </linearGradient>
    <g id="brick">
      <rect x="-7" y="-3.4" width="14" height="6.8" rx="1" fill="#C98255" stroke="#7B3A22" stroke-width=".9"/>
      <path d="M-7 0 H7 M0 -3.4 V3.4" stroke="#8D4A2C" stroke-width=".6" opacity=".55"/>
      <path d="M-6 -2.6 H6" stroke="#E9B98D" stroke-width=".7" opacity=".65"/>
    </g>
  </defs>

  <g clip-path="url(#hex)">
    <rect width="200" height="230" fill="url(#earth)"/>
    <rect width="200" height="230" fill="url(#sun)"/>

    <!-- broad terraced plateau -->
    <g stroke="#78341E" stroke-linejoin="round">
      <path d="M-4 76 Q32 40 88 38 Q146 36 190 66 L204 92 L204 136 Q140 120 96 130 Q44 142 -4 124 Z" fill="#C26A3C" stroke-width="1.6"/>
      <path d="M-4 68 Q34 34 90 32 Q148 30 194 60 L204 82 Q150 54 96 58 Q46 62 -4 96 Z" fill="#D98F5C" stroke-width="1.4"/>
      <path d="M-4 56 Q38 26 94 24 Q152 23 198 52 L202 66 Q150 40 94 42 Q44 44 -4 74 Z" fill="#E7AA76" stroke-width="1.4"/>
    </g>
    <!-- grass and scrub on the high ground -->
    <g fill="#7C8A3D" opacity=".8">
      <ellipse cx="20" cy="44" rx="18" ry="8"/>
      <ellipse cx="142" cy="30" rx="22" ry="7"/>
      <ellipse cx="186" cy="52" rx="14" ry="6"/>
    </g>

    <!-- exposed clay pit: layered bowl -->
    <g>
      <path d="M44 128 Q58 96 100 92 Q144 90 162 122 Q170 146 146 162 Q112 180 74 164 Q44 150 44 128 Z" fill="#9A4426" stroke="#78341E" stroke-width="1.8"/>
      <path d="M56 126 Q68 102 102 99 Q138 97 152 124 Q158 142 138 154 Q108 168 78 154 Q56 144 56 126 Z" fill="#B25C34"/>
      <path d="M66 126 Q78 110 104 108 Q134 106 144 128 Q148 140 132 148 Q106 158 82 146 Q68 138 66 126 Z" fill="url(#clay)"/>
      <path d="M82 130 Q92 118 110 116 Q130 115 136 130" fill="none" stroke="#F0C79A" stroke-width="1.6" opacity=".6"/>
      <path d="M76 148 q18 8 38 2 q16 -4 28 -12" fill="none" stroke="#8C3D22" stroke-width="1.4" opacity=".5"/>
    </g>

    <!-- terraced ledges on the right -->
    <g stroke="#78341E" stroke-width="1.3" fill="#C97747">
      <path d="M156 112 Q176 100 198 104 L200 116 Q178 112 160 122 Z"/>
      <path d="M160 134 Q180 124 204 128 L204 141 Q182 136 162 146 Z"/>
      <path d="M154 156 Q176 148 200 152 L200 166 Q178 160 156 170 Z"/>
    </g>
    <g fill="none" stroke="#F1BE8C" stroke-width="1.2" opacity=".5">
      <path d="M158 114 q18 -8 38 -4 M162 137 q18 -8 38 -3 M156 159 q18 -6 40 -1"/>
    </g>

    <!-- paths into the pit -->
    <path d="M58 28 Q82 54 78 88 Q74 112 92 126" fill="none" stroke="#E9BD90" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <path d="M58 28 Q82 54 78 88 Q74 112 92 126" fill="none" stroke="#8E4326" stroke-width="1.2" stroke-dasharray="3 4" opacity=".45"/>
    <path d="M150 52 Q136 76 140 98 Q144 118 130 136" fill="none" stroke="#E9BD90" stroke-width="5.5" stroke-linecap="round" opacity=".45"/>

    <!-- stacked bricks by the pit -->
    <g transform="translate(146 150) rotate(-5)">
      <use href="#brick" x="-16" y="10"/>
      <use href="#brick" x="-1" y="10"/>
      <use href="#brick" x="14" y="10"/>
      <use href="#brick" x="-9" y="2"/>
      <use href="#brick" x="6" y="2"/>
      <use href="#brick" x="-1" y="-6"/>
    </g>
    <g transform="translate(52 162) rotate(6) scale(.9)">
      <use href="#brick" x="-14" y="6"/>
      <use href="#brick" x="1" y="6"/>
      <use href="#brick" x="-7" y="-2"/>
    </g>

    <!-- wooden cart with clay load -->
    <g transform="translate(146 190)">
      <ellipse cx="0" cy="12" rx="24" ry="4" fill="#5B2A18" opacity=".25"/>
      <path d="M-18 0 H14 L18 8 H-16 Z" fill="#8A5A2B" stroke="#4A2A17" stroke-width="1.3"/>
      <path d="M-14 -4 Q-4 -12 8 -5 L10 0 H-16 Z" fill="#C98255" stroke="#7B3A22" stroke-width="1.1"/>
      <circle cx="-11" cy="9" r="5" fill="#6B4B2E" stroke="#3E2818" stroke-width="1.1"/>
      <circle cx="8" cy="9" r="5" fill="#6B4B2E" stroke="#3E2818" stroke-width="1.1"/>
      <circle cx="-11" cy="9" r="1.4" fill="#C9A227"/>
      <circle cx="8" cy="9" r="1.4" fill="#C9A227"/>
      <path d="M18 6 L28 -6" stroke="#4A2A17" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g transform="translate(154 194)">
      <path d="M-16 4 l3 -6 l7 -1 l4 6 Z" fill="#A58B62" opacity=".8"/>
    </g>

    <!-- rocks and dry scrub -->
    <g fill="#8C6B50" stroke="#5A3A24" stroke-width="1">
      <path d="M28 152 l4 -7 l9 0 l4 6 l-3 5 Z"/>
      <path d="M178 176 l3 -6 l8 0 l3 5 l-3 5 Z"/>
      <path d="M92 186 l3 -5 l7 0 l3 5 Z" opacity=".8"/>
    </g>
    <g fill="none" stroke="#6C7A38" stroke-width="1.8" stroke-linecap="round">
      <path d="M32 174 q3 -10 0 -16 M39 176 q3 -9 0 -15"/>
      <path d="M170 44 q3 -9 0 -14 M176 46 q3 -8 0 -13"/>
    </g>

    <path d="M100 12 L188 62 L188 168 L100 218 L12 168 L12 62 Z" fill="none" stroke="#F7D0A8" stroke-width="1.2" opacity=".24"/>
  </g>
  <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z" fill="none" stroke="#4A3A2A" stroke-width="1.7" stroke-opacity=".6" stroke-linejoin="round"/>
</svg>
