<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <defs>
    <clipPath id="hex">
      <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z"/>
    </clipPath>
    <g id="sheep">
      <path d="M-14 8 v9 M-5 9 v9 M5 9 v9 M13 7 v9" stroke="#3B2F2F" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M-18 0 q-3 -9 6 -10 q1 -9 10 -8 q5 -6 12 -2 q9 -1 10 7 q8 3 5 10 q-1 7 -9 6 q-4 6 -12 4 q-7 3 -12 -2 q-8 1 -10 -5 Z" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="2.2" stroke-linejoin="round"/>
      <ellipse cx="19" cy="-4" rx="6.5" ry="5.5" fill="#6B5B4E" stroke="#3B2F2F" stroke-width="2.2"/>
      <path d="M23 -9 q4 -3 5 1 q0 3 -3 3" fill="#6B5B4E" stroke="#3B2F2F" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="17.5" cy="-5.5" r="1.1" fill="#F3E9D2"/>
      <path d="M-9 -6 q4 -3 8 0 M1 -10 q4 -2 6 2 M-7 1 q4 2 8 0 M5 -2 q4 1 6 -1" stroke="#3B2F2F" stroke-width="1.1" fill="none" opacity=".3"/>
    </g>
    <g id="flower">
      <circle cx="0" cy="-3.4" r="2.2" fill="#F3E9D2"/>
      <circle cx="3.2" cy="-1" r="2.2" fill="#F3E9D2"/>
      <circle cx="2" cy="2.6" r="2.2" fill="#F3E9D2"/>
      <circle cx="-2" cy="2.6" r="2.2" fill="#F3E9D2"/>
      <circle cx="-3.2" cy="-1" r="2.2" fill="#F3E9D2"/>
      <circle cx="0" cy="0" r="1.6" fill="#C9A227"/>
    </g>
  </defs>

  <g clip-path="url(#hex)">
    <rect width="200" height="230" fill="#8FB559"/>
    <!-- rolling pasture patches -->
    <g stroke="none">
      <path d="M0 70 Q48 42 104 66 Q154 86 200 60 L200 118 Q152 136 104 116 Q48 96 0 122 Z" fill="#9CC264" opacity=".8"/>
      <path d="M0 152 Q52 128 108 152 Q156 172 200 146 L200 206 Q150 222 102 202 Q48 182 0 208 Z" fill="#7DA64B" opacity=".8"/>
      <ellipse cx="146" cy="92" rx="44" ry="22" fill="#A3C86C" opacity=".65"/>
      <ellipse cx="42" cy="180" rx="38" ry="20" fill="#A3C86C" opacity=".5"/>
    </g>
    <!-- woodcut grass hatching -->
    <g fill="none" stroke="#5E7A3A" stroke-width="2.1" stroke-linecap="round" opacity=".75">
      <path d="M30 84 q3 -10 0 -17 M39 86 q3 -10 0 -17 M48 84 q3 -10 0 -17"/>
      <path d="M150 66 q3 -10 0 -17 M159 68 q3 -10 0 -17"/>
      <path d="M66 196 q3 -10 0 -17 M75 198 q3 -10 0 -17 M84 196 q3 -10 0 -17"/>
      <path d="M148 186 q3 -10 0 -17 M157 188 q3 -10 0 -17 M166 186 q3 -10 0 -17"/>
      <path d="M24 136 q3 -8 0 -14 M33 138 q3 -8 0 -14"/>
      <path d="M170 130 q3 -8 0 -14 M179 132 q3 -8 0 -14"/>
    </g>
    <!-- tiny meadow flowers -->
    <use href="#flower" transform="translate(66 74) scale(.8)"/>
    <use href="#flower" transform="translate(126 78) scale(.7)"/>
    <use href="#flower" transform="translate(34 154) scale(.85)"/>
    <use href="#flower" transform="translate(172 160) scale(.75)"/>
    <use href="#flower" transform="translate(112 210) scale(.8)"/>
    <use href="#flower" transform="translate(62 194) scale(.65)"/>

    <!-- flock -->
    <use href="#sheep" transform="translate(72 96) scale(1.05)"/>
    <use href="#sheep" transform="translate(132 118) scale(.9)"/>
    <use href="#sheep" transform="translate(48 158) scale(.95)"/>
    <use href="#sheep" transform="translate(116 166) scale(1.0)"/>
    <use href="#sheep" transform="translate(158 196) scale(.78)"/>
    <use href="#sheep" transform="translate(90 204) scale(.72)"/>

    <!-- fence at the meadow edge -->
    <g transform="translate(28 60) rotate(-4)" stroke="#3B2F2F" stroke-linejoin="round">
      <rect x="0" y="-2" width="5" height="22" rx="1.5" fill="#8A5A2B" stroke-width="1.6"/>
      <rect x="24" y="-2" width="5" height="22" rx="1.5" fill="#8A5A2B" stroke-width="1.6"/>
      <rect x="48" y="-2" width="5" height="22" rx="1.5" fill="#8A5A2B" stroke-width="1.6"/>
      <rect x="-2" y="4" width="57" height="4" rx="1.5" fill="#A6743E" stroke-width="1.4"/>
      <rect x="-2" y="13" width="57" height="4" rx="1.5" fill="#A6743E" stroke-width="1.4"/>
    </g>
    <!-- small path stones -->
    <g fill="#C9B184" stroke="#3B2F2F" stroke-width="1.2" stroke-linejoin="round" opacity=".8">
      <path d="M92 138 q6 -3 9 2 q-1 5 -8 4 q-3 -3 -1 -6 Z"/>
      <path d="M104 148 q5 -2 8 2 q-1 4 -7 3 q-3 -2 -1 -5 Z"/>
      <path d="M84 152 q5 -2 8 2 q-1 4 -7 3 q-3 -2 -1 -5 Z"/>
    </g>
    <path d="M100 13 L187 62 L187 168 L100 217 L13 168 L13 62 Z" fill="none" stroke="#F3E9D2" stroke-width="1.6" opacity=".16"/>
  </g>
  <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z" fill="none" stroke="#3B2F2F" stroke-width="4" stroke-linejoin="round"/>
</svg>
