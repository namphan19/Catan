<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <defs>
    <clipPath id="hex">
      <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z"/>
    </clipPath>
    <linearGradient id="sand" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#F0DCA6"/>
      <stop offset=".5" stop-color="#DEBF82"/>
      <stop offset="1" stop-color="#C4A064"/>
    </linearGradient>
    <radialGradient id="sun" cx="32%" cy="14%" r="80%">
      <stop offset="0" stop-color="#FFF6CD" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#F6DFA0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#A67A42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F2DEB0"/>
      <stop offset=".55" stop-color="#E3C58D"/>
      <stop offset="1" stop-color="#BE9A61"/>
    </linearGradient>
    <g id="tuft">
      <path d="M0 4 V-6 M0 0 l-5 -6 M0 -2 l6 -7 M0 2 l-7 -3 M0 2 l7 -4" fill="none" stroke="#8E8C45" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </defs>

  <g clip-path="url(#hex)">
    <rect width="200" height="230" fill="url(#sand)"/>
    <rect width="200" height="230" fill="url(#sun)"/>

    <!-- distant dunes -->
    <path d="M-10 94 Q28 58 70 78 Q102 94 132 70 Q164 46 210 80 V130 H-10 Z" fill="#E7CC96" opacity=".8"/>
    <path d="M-10 110 Q34 82 74 98 Q110 112 140 90 Q174 66 210 96 V150 H-10 Z" fill="url(#dune)"/>
    <!-- dune shadow lines -->
    <g fill="none" stroke="#B58C50" stroke-width="1.4" opacity=".45" stroke-linecap="round">
      <path d="M-6 122 Q36 96 78 110 Q114 122 146 100 Q176 80 206 104"/>
      <path d="M-6 132 Q40 106 82 120 Q118 132 150 110 Q178 92 206 114"/>
      <path d="M-6 84 Q32 62 66 74 Q96 86 124 68 Q158 48 206 72"/>
    </g>

    <!-- mid dune ridge -->
    <path d="M-10 156 Q30 126 72 146 Q108 164 142 142 Q174 120 210 148 V230 H-10 Z" fill="#D8B77C"/>
    <path d="M-10 156 Q30 126 72 146 Q108 164 142 142 Q174 120 210 148" fill="none" stroke="#F4E2B8" stroke-width="3" opacity=".65"/>
    <path d="M-10 170 Q34 148 76 162 Q112 174 146 154 Q178 136 210 160 V230 H-10 Z" fill="#CFAC70" opacity=".85"/>

    <!-- foreground dune waves -->
    <path d="M-10 196 Q34 174 78 190 Q116 204 152 184 Q180 168 210 188 V230 H-10 Z" fill="#E0C18A"/>
    <path d="M-10 196 Q34 174 78 190 Q116 204 152 184 Q180 168 210 188" fill="none" stroke="#F6E7C2" stroke-width="2.6" opacity=".7"/>
    <g fill="none" stroke="#A97F46" stroke-width="1.1" opacity=".5" stroke-linecap="round">
      <path d="M22 212 q16 -6 32 0 M88 216 q16 -5 32 0 M146 212 q14 -5 28 0"/>
      <path d="M18 186 q12 -4 24 0 M102 196 q14 -4 28 0"/>
    </g>

    <!-- dry scrub -->
    <use href="#tuft" transform="translate(40 150) scale(1.2)"/>
    <use href="#tuft" transform="translate(58 160) scale(.9)"/>
    <use href="#tuft" transform="translate(156 132) scale(1.1)"/>
    <use href="#tuft" transform="translate(174 148) scale(.8)"/>
    <use href="#tuft" transform="translate(124 206) scale(1.0)"/>
    <use href="#tuft" transform="translate(26 204) scale(.85)"/>

    <!-- rocks -->
    <g fill="#B39A72" stroke="#6B5438" stroke-width="1.1">
      <path d="M148 174 l5 -9 l11 -1 l5 8 l-4 7 Z"/>
      <path d="M42 190 l4 -6 l8 -1 l4 6 l-3 5 Z" opacity=".9"/>
      <path d="M98 188 l3 -5 l7 0 l3 5 l-2 4 Z" opacity=".75"/>
    </g>
    <path d="M152 170 l5 -5 l6 0" fill="none" stroke="#E4D2A8" stroke-width="1.2" opacity=".8"/>

    <!-- sun-bleached bones -->
    <g transform="translate(96 150) rotate(-8)" stroke="#F1E6C8" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M-12 2 q6 -5 12 0 M-11 4 q6 -4 12 0"/>
      <circle cx="-13" cy="1" r="2.2" fill="#EFE3C2"/>
      <circle cx="-13" cy="5" r="2.2" fill="#EFE3C2"/>
      <path d="M12 -1 l7 -4 M14 3 l7 4"/>
    </g>
    <!-- small skull -->
    <g transform="translate(126 172)" fill="#EFE3C2" stroke="#8F7A56" stroke-width="1">
      <path d="M-6 -2 q0 -6 6 -6 q6 0 6 6 q0 4 -3 5 l-1 4 h-4 l-1 -4 q-3 -1 -3 -5 Z"/>
      <circle cx="-2" cy="-1" r="1.2" fill="#6B5438"/>
      <circle cx="2" cy="-1" r="1.2" fill="#6B5438"/>
    </g>

    <!-- lone caravan silhouette near the horizon -->
    <g transform="translate(50 92)" fill="#8C6E42" opacity=".55">
      <path d="M0 4 q-2 -6 2 -9 q2 -3 5 -1 q4 -2 5 2 q3 3 0 8 l-2 0 l-1 3 l-2 0 l0 -3 l-3 0 l0 3 l-2 0 Z"/>
      <path d="M16 5 V-3 M16 -2 l5 -3" stroke="#8C6E42" stroke-width="1.2" fill="none"/>
    </g>

    <path d="M100 12 L188 62 L188 168 L100 218 L12 168 L12 62 Z" fill="none" stroke="#FFF0C8" stroke-width="1.2" opacity=".32"/>
  </g>
  <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z" fill="none" stroke="#4A3A2A" stroke-width="1.7" stroke-opacity=".6" stroke-linejoin="round"/>
</svg>
