<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <defs>
    <clipPath id="hex">
      <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z"/>
    </clipPath>
    <g id="cactus">
      <path d="M0 16 v-42 q0 -6 5 -6 q5 0 5 6 v42 Z" fill="#6A7B55" stroke="#373030" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M-1 -8 h-7 q-5 0 -5 5 v10 q0 4 4 4 q4 0 4 -4 v-6 h4" fill="#6A7B55" stroke="#373030" stroke-width="2" stroke-linejoin="round"/>
      <path d="M10 -18 h6 q5 0 5 5 v8 q0 4 -4 4 q-4 0 -4 -4 v-4 h-3" fill="#6A7B55" stroke="#373030" stroke-width="2" stroke-linejoin="round"/>
      <path d="M2 -40 v46 M7 -40 v46 M-5 -4 v8 M16 -14 v8" stroke="#373030" stroke-width=".9" opacity=".3"/>
      <path d="M-6 -30 h-2 M12 -24 h2 M-5 2 h-2 M15 0 h2 M-8 -12 h-2" stroke="#373030" stroke-width=".8" opacity=".55"/>
    </g>
  </defs>

  <g clip-path="url(#hex)">
    <rect width="200" height="230" fill="#CCC1A4"/>
    <!-- far dunes -->
    <path d="M0 92 Q48 62 98 88 Q150 116 200 82 L200 142 Q150 166 98 138 Q46 112 0 146 Z" fill="#D9CFB5"/>
    <path d="M0 92 Q48 62 98 88 Q150 116 200 82" fill="none" stroke="#B3A688" stroke-width="1.6" opacity=".55"/>
    <path d="M0 150 Q56 126 106 152 Q154 176 200 148 L200 204 Q152 222 100 200 Q48 178 0 206 Z" fill="#BAAF91"/>
    <path d="M0 150 Q56 126 106 152 Q154 176 200 148" fill="none" stroke="#A29677" stroke-width="1.7" opacity=".6"/>
    <path d="M0 206 Q50 182 100 204 Q150 226 200 202 L200 230 L0 230 Z" fill="#ADA082"/>
    <!-- wind ripples -->
    <g fill="none" stroke="#A29677" stroke-width="1.2" opacity=".55" stroke-linecap="round">
      <path d="M22 108 q16 -8 32 0 M124 118 q18 -9 36 0 M62 88 q14 -6 28 0"/>
      <path d="M32 168 q18 -8 36 0 M116 178 q18 -8 36 0 M66 196 q14 -5 28 0"/>
      <path d="M138 142 q14 -6 28 0 M18 140 q12 -5 24 0"/>
    </g>
    <!-- cracked earth patch -->
    <g>
      <path d="M18 190 q22 -14 48 -6 q22 7 18 24 q-18 12 -44 4 q-26 -6 -22 -22 Z" fill="#B8AB8F" stroke="#373030" stroke-width="1.6" stroke-linejoin="round"/>
      <g fill="none" stroke="#7F745B" stroke-width="1.3" opacity=".7" stroke-linecap="round">
        <path d="M36 196 l8 8 l-2 8 M44 204 l12 -1 M62 198 l4 9 l10 2 M52 188 l1 10"/>
      </g>
    </g>
    <!-- cacti -->
    <use href="#cactus" transform="translate(58 138) scale(1.05)"/>
    <use href="#cactus" transform="translate(162 168) scale(.8)"/>
    <!-- dry shrub -->
    <g transform="translate(120 92)" fill="none" stroke="#78654F" stroke-width="2.2" stroke-linecap="round">
      <path d="M0 16 L0 0 M0 6 L-10 -4 M0 8 L10 -2 M0 2 L-6 -8 M0 4 L7 -8"/>
      <circle cx="-10" cy="-4" r="1.6" fill="#78654F" stroke="none"/>
      <circle cx="10" cy="-2" r="1.6" fill="#78654F" stroke="none"/>
    </g>
    <g transform="translate(40 82) scale(.8)" fill="none" stroke="#78654F" stroke-width="2" stroke-linecap="round">
      <path d="M0 14 L0 0 M0 6 L-8 -4 M0 8 L8 -2 M0 2 L-5 -7"/>
    </g>
    <!-- bleached cow skull -->
    <g transform="translate(140 202) rotate(-8)" stroke="#373030" stroke-width="1.5" stroke-linejoin="round">
      <path d="M-10 0 q-2 -9 6 -10 q10 -2 12 6 q1 6 -6 8 q-9 3 -12 -4 Z" fill="#E8E1CF"/>
      <path d="M-9 -5 q-8 -8 -14 -4 q6 2 8 8 M13 -6 q8 -7 13 -2 q-6 2 -8 8" fill="none" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="-2" cy="-1" r="2.2" fill="#373030"/>
      <circle cx="6" cy="-1" r="2.2" fill="#373030"/>
      <path d="M2 5 v3 M2 8 l-3 2 M2 8 l3 2" stroke-width="1.2" fill="none"/>
    </g>
    <!-- scattered stones -->
    <g fill="#A29677" stroke="#373030" stroke-width="1.4" stroke-linejoin="round">
      <path d="M94 172 l3 -6 l9 0 l4 6 l-3 5 l-10 0 Z"/>
      <path d="M30 130 l2 -4 l7 0 l3 4 l-2 4 l-8 0 Z" opacity=".85"/>
      <path d="M170 126 l2 -4 l6 0 l3 4 l-2 3 l-7 0 Z" opacity=".8"/>
    </g>
    <!-- tracks in the sand -->
    <g fill="#A29677" opacity=".8">
      <ellipse cx="88" cy="210" rx="2.2" ry="1.4" transform="rotate(20 88 210)"/>
      <ellipse cx="94" cy="214" rx="2.2" ry="1.4" transform="rotate(20 94 214)"/>
      <ellipse cx="84" cy="217" rx="2.2" ry="1.4" transform="rotate(20 84 217)"/>
      <ellipse cx="90" cy="221" rx="2.2" ry="1.4" transform="rotate(20 90 221)"/>
    </g>
    <path d="M100 13 L187 62 L187 168 L100 217 L13 168 L13 62 Z" fill="none" stroke="#E8E1CF" stroke-width="1.6" opacity=".18"/>
  </g>
  <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z" fill="none" stroke="#373030" stroke-width="4" stroke-linejoin="round"/>
</svg>
