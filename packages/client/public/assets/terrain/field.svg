        <ellipse cx="3.6" cy="-9" rx="2.2" ry="3.6" transform="rotate(-28 3.6 -9)"/>
        <ellipse cx="-3.4" cy="-4.6" rx="2.2" ry="3.6" transform="rotate(28 -3.4 -4.6)"/>
