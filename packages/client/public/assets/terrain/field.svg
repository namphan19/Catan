        <ellipse cx="-2.9" cy="-0.4" rx="2.1" ry="3.4" transform="rotate(28 -2.9 -0.4)"/>
        <ellipse cx="2.9" cy="-0.4" rx="2.1" ry="3.4" transform="rotate(-28 2.9 -0.4)"/>
