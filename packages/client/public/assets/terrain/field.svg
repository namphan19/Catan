    <use href="#wheat" transform="translate(104 182) scale(.7) rotate(7)"/>
    <use href="#wheat" transform="translate(132 176) scale(.9) rotate(-5)"/>
    <use href="#wheat" transform="translate(160 184) scale(.8) rotate(6)"/>
