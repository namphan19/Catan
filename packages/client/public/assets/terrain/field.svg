    <use href="#wheat" transform="translate(118 108) scale(.75) rotate(-8)"/>
    <use href="#wheat" transform="translate(150 118) scale(.95) rotate(6)"/>
    <use href="#wheat" transform="translate(174 108) scale(.7) rotate(-5)"/>
    <use href="#wheat" transform="translate(30 146) scale(.8) rotate(-6)"/>
    <use href="#wheat" transform="translate(54 140) scale(.95) rotate(7)"/>
    <use href="#wheat" transform="translate(84 148) scale(.7) rotate(-5)"/>
    <use href="#wheat" transform="translate(112 142) scale(.85) rotate(8)"/>
