<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <defs>
    <clipPath id="hex">
      <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z"/>
    </clipPath>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6B9553"/>
      <stop offset="0.55" stop-color="#4E7A44"/>
      <stop offset="1" stop-color="#3C6338"/>
    </linearGradient>
    <radialGradient id="sun" cx="32%" cy="18%" r="78%">
      <stop offset="0" stop-color="#D6E39B" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#A9C878" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2B4A2C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C3A878"/>
      <stop offset=".5" stop-color="#D3B98A"/>
      <stop offset="1" stop-color="#B99A68"/>
    </linearGradient>
    <g id="crown">
      <circle cx="-9" cy="2" r="13"/>
      <circle cx="7" cy="-4" r="15"/>
      <circle cx="14" cy="8" r="11"/>
      <circle cx="-5" cy="13" r="10"/>
      <circle cx="3" cy="6" r="16"/>
    </g>
    <g id="pine">
      <rect x="-2.4" y="8" width="4.8" height="10" rx="1.6" fill="#6B4B2E"/>
      <path d="M0 -36 L13 -17 L7 -17 L20 -1 L-20 -1 L-7 -17 L-13 -17 Z" fill="#2C5637" stroke="#24452D" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M0 -27 L9 -12 L4 -12 L14 0 L-14 0 L-4 -12 L-9 -12 Z" fill="#3C7048"/>
      <path d="M-7 -16 q7 -5 13 -1" fill="none" stroke="#86B56C" stroke-width="1.5" opacity=".55" stroke-linecap="round"/>
    </g>
  </defs>

  <g clip-path="url(#hex)">
    <rect width="200" height="230" fill="url(#ground)"/>
    <rect width="200" height="230" fill="url(#sun)"/>

    <!-- soft moss banks -->
    <g opacity=".55">
      <ellipse cx="46" cy="52" rx="50" ry="28" fill="#7FA35D"/>
      <ellipse cx="151" cy="44" rx="45" ry="23" fill="#759B59"/>
      <ellipse cx="160" cy="132" rx="56" ry="40" fill="#3B6037"/>
      <ellipse cx="37" cy="148" rx="52" ry="36" fill="#41693C"/>
      <ellipse cx="104" cy="204" rx="80" ry="32" fill="#365A34"/>
    </g>

    <!-- distant canopy -->
    <g fill="#2E5637" opacity=".9">
      <use href="#crown" transform="translate(42 52) scale(.75)"/>
      <use href="#crown" transform="translate(92 40) scale(.65)"/>
      <use href="#crown" transform="translate(148 54) scale(.72)"/>
      <use href="#crown" transform="translate(176 108) scale(.6)"/>
    </g>

    <!-- winding forest trail -->
    <path d="M20 188 Q52 172 76 184 Q102 198 124 184 Q148 168 184 180 L184 198 Q150 188 128 200 Q104 212 78 200 Q52 188 22 202 Z" fill="url(#trail)" opacity=".92"/>
    <path d="M30 195 q24 -8 48 0 q24 8 48 -4 q18 -8 46 -2" fill="none" stroke="#8E7248" stroke-width="1.2" opacity=".5" stroke-dasharray="3 5"/>

    <!-- dense forest canopy: dark under-story first -->
    <g fill="#2B5135">
      <use href="#crown" transform="translate(29 102) scale(1.02)"/>
      <use href="#crown" transform="translate(72 92) scale(1.16)"/>
      <use href="#crown" transform="translate(122 82) scale(1.05)"/>
      <use href="#crown" transform="translate(171 96) scale(.96)"/>
      <use href="#crown" transform="translate(50 139) scale(1.12)"/>
      <use href="#crown" transform="translate(102 130) scale(1.22)"/>
      <use href="#crown" transform="translate(158 144) scale(1.04)"/>
      <use href="#crown" transform="translate(80 176) scale(.92)"/>
      <use href="#crown" transform="translate(139 178) scale(1.0)"/>
    </g>
    <g fill="#386841">
      <use href="#crown" transform="translate(31 99) scale(.86)"/>
      <use href="#crown" transform="translate(74 89) scale(.95)"/>
      <use href="#crown" transform="translate(124 79) scale(.86)"/>
      <use href="#crown" transform="translate(168 94) scale(.8)"/>
      <use href="#crown" transform="translate(51 136) scale(.92)"/>
      <use href="#crown" transform="translate(104 127) scale(.98)"/>
      <use href="#crown" transform="translate(155 141) scale(.85)"/>
    </g>
    <g fill="#4B7F4C" opacity=".95">
      <use href="#crown" transform="translate(30 96) scale(.66)"/>
      <use href="#crown" transform="translate(77 85) scale(.7)"/>
      <use href="#crown" transform="translate(127 76) scale(.6)"/>
      <use href="#crown" transform="translate(165 91) scale(.58)"/>
      <use href="#crown" transform="translate(56 133) scale(.62)"/>
      <use href="#crown" transform="translate(108 124) scale(.68)"/>
      <use href="#crown" transform="translate(151 138) scale(.6)"/>
    </g>
    <!-- sunlit leaf tips -->
    <g fill="#79A95C" opacity=".9">
      <use href="#crown" transform="translate(72 79) scale(.42)"/>
      <use href="#crown" transform="translate(118 101) scale(.4)"/>
      <use href="#crown" transform="translate(44 130) scale(.36)"/>
      <use href="#crown" transform="translate(159 130) scale(.34)"/>
      <use href="#crown" transform="translate(89 168) scale(.32)"/>
    </g>

    <!-- conifers standing clear of the canopy -->
    <use href="#pine" transform="translate(46 66) scale(.8)"/>
    <use href="#pine" transform="translate(94 58) scale(.92)"/>
    <use href="#pine" transform="translate(142 70) scale(.78)"/>
    <use href="#pine" transform="translate(62 112) scale(.86)"/>
    <use href="#pine" transform="translate(118 106) scale(1.0)"/>
    <use href="#pine" transform="translate(167 112) scale(.82)"/>
    <use href="#pine" transform="translate(88 154) scale(.9)"/>
    <use href="#pine" transform="translate(145 158) scale(.84)"/>

    <!-- undergrowth and details -->
    <g fill="#5A8C4C">
      <ellipse cx="22" cy="64" rx="14" ry="8"/>
      <ellipse cx="179" cy="72" rx="12" ry="7"/>
      <ellipse cx="22" cy="174" rx="13" ry="7"/>
      <ellipse cx="180" cy="166" rx="11" ry="6"/>
    </g>
    <g stroke="#2B4A2C" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".8">
      <path d="M34 58 q3 -10 0 -16 M40 60 q3 -9 0 -15"/>
      <path d="M160 66 q3 -9 0 -15 M166 68 q3 -8 0 -14"/>
      <path d="M30 168 q3 -9 0 -15 M36 171 q3 -8 0 -14"/>
    </g>
    <g fill="#864A40" opacity=".9">
      <circle cx="88" cy="196" r="2.2"/><circle cx="93" cy="199" r="1.8"/><circle cx="84" cy="200" r="1.6"/>
    </g>
    <g fill="#B3B48F">
      <path d="M152 198 l4 -8 l9 -1 l5 7 l-4 7 Z" opacity=".9"/>
      <path d="M40 206 l3 -6 l7 0 l3 6 l-3 5 Z" opacity=".8"/>
    </g>

    <!-- inner rim light -->
    <path d="M100 12 L188 62 L188 168 L100 218 L12 168 L12 62 Z" fill="none" stroke="#D9E4BC" stroke-width="1.2" opacity=".2"/>
  </g>
  <path d="M100 3 L197 59 L197 171 L100 227 L3 171 L3 59 Z" fill="none" stroke="#4A3A2A" stroke-width="1.7" stroke-opacity=".6" stroke-linejoin="round"/>
</svg>
