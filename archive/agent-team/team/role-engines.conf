# Which engine runs a role: role=engine[:model[:effort]]. Read by scripts/dispatch.sh.
# A role that is not listed runs on opencode (model from team/role-models.conf, else the default in
# scripts/opencode-sub.sh). See team/ENGINES.md.
#   engine  opencode | copilot | claude
#   model   copilot only: a Copilot model id (check the exact spelling with a one-line prompt), or "auto"
#   effort  copilot only: none|minimal|low|medium|high|xhigh|max; "auto" rejects an effort, so set it only with
#           an explicit model
# Examples (none active):
#   reviewer=copilot:claude-sonnet-5.5:high
#   qa=copilot
# When a role moves to copilot, do NOT leave a "role=copilot/..." line in role-models.conf: if the role later
# falls back to opencode, dispatch.sh would pass it to opencode as the model and the agent would crash.
# claude engine: Claude Code (`claude -p --bare`) on a custom Anthropic-compatible endpoint. Line format
# role=claude[:model[:effort]], e.g.  reviewer=claude:claude-sonnet-5
# Config: ~/.config/agent-team/claude.env (ANTHROPIC_BASE_URL, ANTHROPIC_AUTH_TOKEN, ANTHROPIC_MODEL), outside the repo.
