<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 168">
  <defs>
    <clipPath id="art">
      <rect x="13" y="13" width="94" height="119" rx="5"/>
    </clipPath>
    <linearGradient id="woodsky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#7FA85A"/>
      <stop offset=".5" stop-color="#4E7D46"/>
      <stop offset="1" stop-color="#2F5A37"/>
    </linearGradient>
    <radialGradient id="woodlight" cx="32%" cy="18%" r="78%">
      <stop offset="0" stop-color="#E8F0B0" stop-opacity=".7"/>
      <stop offset=".6" stop-color="#C2D77E" stop-opacity=".18"/>
      <stop offset="1" stop-color="#274A2C" stop-opacity="0"/>
    </radialGradient>
    <g id="leafy">
      <circle cx="-8" cy="2" r="11"/>
      <circle cx="7" cy="-4" r="13"/>
      <circle cx="12" cy="7" r="9"/>
      <circle cx="0" cy="10" r="10"/>
    </g>
    <g id="log">
      <rect x="-33" y="-6" width="66" height="12" rx="6" fill="#8A5A2B" stroke="#3B2F2F" stroke-width="1.5"/>
      <ellipse cx="33" cy="0" rx="7" ry="6" fill="#D9A75C" stroke="#3B2F2F" stroke-width="1.4"/>
      <ellipse cx="33" cy="0" rx="4.2" ry="3.5" fill="none" stroke="#A97A3E" stroke-width="1"/>
      <path d="M26 -3.6 q5 3.6 0 7.2" fill="none" stroke="#A97A3E" stroke-width=".9" opacity=".8"/>
      <path d="M-29 -2.2 H20" stroke="#B98B52" stroke-width="1.4" opacity=".65" stroke-linecap="round"/>
      <path d="M-26 2.6 H14" stroke="#5B4126" stroke-width="1" opacity=".35" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- card frame -->
  <rect x="3" y="3" width="114" height="162" rx="10" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="3"/>
  <rect x="9" y="9" width="102" height="150" rx="6" fill="#FBF5E4" stroke="#B08C55" stroke-width="1.2"/>

  <!-- illustration -->
  <g clip-path="url(#art)">
    <rect x="13" y="13" width="94" height="119" fill="url(#woodsky)"/>
    <rect x="13" y="13" width="94" height="119" fill="url(#woodlight)"/>
    <!-- distant canopy -->
    <g fill="#2E5637" opacity=".85">
      <use href="#leafy" transform="translate(30 30) scale(.8)"/>
      <use href="#leafy" transform="translate(76 27) scale(.7)"/>
      <use href="#leafy" transform="translate(103 45) scale(.6)"/>
      <use href="#leafy" transform="translate(18 58) scale(.6)"/>
    </g>
    <g fill="#3D7048" opacity=".9">
      <use href="#leafy" transform="translate(34 34) scale(.55)"/>
      <use href="#leafy" transform="translate(82 32) scale(.5)"/>
      <use href="#leafy" transform="translate(100 50) scale(.45)"/>
    </g>
    <!-- sunlit grass -->
    <path d="M13 108 Q38 96 60 106 Q82 116 107 102 V132 H13 Z" fill="#5B8B4A"/>
    <path d="M13 118 Q40 108 62 116 Q84 124 107 114 V132 H13 Z" fill="#44743E"/>
    <g fill="none" stroke="#8DBE55" stroke-width="1.6" stroke-linecap="round" opacity=".8">
      <path d="M20 117 q3 -9 0 -14 M26 120 q3 -8 0 -13 M94 116 q3 -9 0 -14 M100 119 q3 -8 0 -13"/>
    </g>
    <!-- pine branch in the top corner -->
    <g transform="translate(24 26) rotate(24)" fill="none" stroke="#2E5637" stroke-width="2.2" stroke-linecap="round">
      <path d="M0 18 V-6"/>
      <path d="M0 12 l-8 -5 M0 7 l-9 -4 M0 2 l-7 -4 M0 12 l8 -5 M0 7 l9 -4 M0 2 l7 -4"/>
    </g>
    <!-- stacked logs -->
    <g transform="translate(60 92) rotate(-9)">
      <use href="#log" x="-4" y="12" transform="scale(.96)"/>
      <use href="#log" x="3" y="0"/>
      <use href="#log" x="-2" y="-12" transform="scale(.94)"/>
      <path d="M-30 18 q12 5 24 0" fill="none" stroke="#3B2F2F" stroke-width="1.2" opacity=".18"/>
    </g>
    <!-- foreground grass and leaves -->
    <g fill="#3F7448" opacity=".9">
      <use href="#leafy" transform="translate(20 126) scale(.4)"/>
      <use href="#leafy" transform="translate(101 128) scale(.35)"/>
    </g>
    <g fill="none" stroke="#8DBE55" stroke-width="1.4" stroke-linecap="round" opacity=".85">
      <path d="M23 130 q3 -8 0 -12 M29 132 q3 -7 0 -11 M94 131 q3 -8 0 -12"/>
    </g>
    <!-- vignette -->
    <path d="M13 13 H107 V132 H13 Z" fill="none" stroke="#203B22" stroke-width="10" opacity=".12"/>
  </g>
  <rect x="13" y="13" width="94" height="119" rx="5" fill="none" stroke="#3B2F2F" stroke-width="1.6"/>

  <!-- corner medallions -->
  <g>
    <circle cx="18.5" cy="18.5" r="7.5" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="1.3"/>
    <circle cx="101.5" cy="18.5" r="7.5" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="1.3"/>
    <circle cx="18.5" cy="126.5" r="7.5" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="1.3"/>
    <circle cx="101.5" cy="126.5" r="7.5" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="1.3"/>
    <g fill="#8A5A2B" stroke="#3B2F2F" stroke-width="1">
      <circle cx="17" cy="18" r="2.2"/><circle cx="20" cy="19.6" r="2.2"/>
      <circle cx="100" cy="18" r="2.2"/><circle cx="103" cy="19.6" r="2.2"/>
      <circle cx="17" cy="126" r="2.2"/><circle cx="20" cy="127.6" r="2.2"/>
      <circle cx="100" cy="126" r="2.2"/><circle cx="103" cy="127.6" r="2.2"/>
    </g>
    <g fill="#D9A75C" stroke="#5B4126" stroke-width=".7">
      <circle cx="17" cy="18" r=".9"/><circle cx="20" cy="19.6" r=".9"/>
      <circle cx="100" cy="18" r=".9"/><circle cx="103" cy="19.6" r=".9"/>
      <circle cx="17" cy="126" r=".9"/><circle cx="20" cy="127.6" r=".9"/>
      <circle cx="100" cy="126" r=".9"/><circle cx="103" cy="127.6" r=".9"/>
    </g>
  </g>

  <!-- nameplate (the UI prints the localised name on top) -->
  <path d="M13 136 H107 V151 Q107 155 103 155 H17 Q13 155 13 151 Z" fill="#F3E9D2" stroke="#3B2F2F" stroke-width="1.4"/>
  <path d="M17 139 H103" stroke="#C9A227" stroke-width="1" opacity=".9"/>
  <circle cx="60" cy="160" r="1.8" fill="#C9A227" stroke="#8B6A3C" stroke-width=".6"/>
</svg>
