# Model tiers for opencode roles (tier=provider/model). Used by scripts/set-model.sh; the lead picks a tier per task.
# Every model here must also be in team/allowed-models.conf (the PO's allowlist).
# default = what scripts/opencode-sub.sh runs when a role has no line in role-models.conf (it reads this line).
# Catalog ids verified 2026-11-13 (opencode DB, table kv, key models-dev:v2:catalog); all three smoke-tested READY.
default=opencode/deepseek-v4.1-flash-free
# fallback = the other free model: use it when default hits a rate limit or loops on a task.
fallback=opencode/glm-5.3-flash-free
# complex = paid via OpenCode Go (0.15 in / 0.5 out USD per 1M tokens), context 1M / output 131k.
complex=opencode-go/glm-5.3-flash
# complex-alt = paid via OpenCode Go (0.15 in / 0.6 out; x2 Mon-Fri 01-04 and 06-10 UTC), context 1M / output 384k.
complex-alt=opencode-go/deepseek-v4.1-flash
